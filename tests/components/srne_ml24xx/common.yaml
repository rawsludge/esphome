    battery_reversely_connected:
      name: Battery Reversely Connected
    battery_low_temperature_charging_stopped:
      name: Battery Low Temperature Charging Stopped
    overcharge_protection:
      name: Overcharge Protection
    battery_low_temperature_discharging_prohibited:
      name: Battery Low Temperature Discharging Prohibited
    battery_high_temperature_discharging_prohibited:
      name: Battery High Temperature Discharging Prohibited
    no_battery_detected:
      name: No Battery Detected
    mains_power_supply:
      name: Mains Power Supply
    solar_panel_reversely_connected:
      name: Solar Panel Reversely Connected
    solar_panel_working_point_over_voltage:
      name: Solar Panel Working Point Over Voltage
    photovoltaic_input_over_voltage:
      name: Photovoltaic Input Over Voltage
    photovoltaic_input_over_power:
      name: Photovoltaic Input Over Power
    battery_high_temperature_charging_prohibited:
      name: Battery High Temperature Charging Prohibited
    controller_temperature_too_high:
      name: Controller Temperature Too High
    load_over_power:
      name: Load Over Power
    load_short_circuit:
      name: Load Short Circuit
    battery_under_voltage:
      name: Battery Under Voltage
    battery_over_voltage:
      name: Battery Over Voltage
    battery_over_discharge:
