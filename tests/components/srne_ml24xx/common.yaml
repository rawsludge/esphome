srne_ml24xx:
  id: srne_ml24xx_controller
  modbus_id: modbus_bus
  address: 0x01
  update_interval: 10s

sensor:
  - platform: srne_ml24xx
    srne_ml24xx_id: srne_ml24xx_controller
    battery_level:
      name: Battery Level
    battery_voltage:
      name: Battery Voltage
    battery_charging_current:
      name: Battery Charging Current
    controller_temperature:
      name: Controller Temperature
    battery_temperature:
      name: Battery Temperature
    load_voltage:
      name: Load Voltage
    load_current:
      name: Load Current
    load_power:
      name: Load Power
    load_brightness:
      name: Load Brightness
    solar_panel_voltage:
      name: Solar Panel Voltage
    solar_panel_current:
      name: Solar Panel Current
    solar_panel_power:
      name: Solar Panel Power
    daily_battery_voltage_min:
      name: Daily Battery Voltage Min
    daily_battery_voltage_max:
      name: Daily Battery Voltage Max
    daily_charging_current_max:
      name: Daily Charging Current Max
    daily_discharging_current_max:
      name: Daily Discharging Current Max
    daily_charging_power_max:
      name: Daily Charging Power Max
    daily_discharging_power_max:
      name: Daily Discharging Power Max
    daily_charging_amp_hours:
      name: Daily Charging Amp Hours
    daily_discharging_amp_hours:
      name: Daily Discharging Amp Hours
    daily_power_generation:
      name: Daily Power Generation
    daily_power_consumption:
      name: Daily Power Consumption
    total_operating_days:
      name: Total Operating Days
    total_battery_over_discharges:
      name: Total Battery Over Discharges
    total_battery_full_charges:
      name: Total Battery Full Charges
    total_charging_amp_hours:
      name: Total Charging Amp Hours
    total_discharging_amp_hours:
      name: Total Discharging Amp Hours
    total_power_generation:
      name: Total Power Generation
    total_power_consumption:
      name: Total Power Consumption
    max_system_voltage:
      name: Max System Voltage
    rated_charging_current:
      name: Rated Charging Current
    rated_discharging_current:
      name: Rated Discharging Current
    recognized_system_voltage:
      name: Recognized System Voltage
    history:
      - day: 1
        battery_voltage_min:
          name: Yesterday Battery Voltage Min
        battery_voltage_max:
          name: Yesterday Battery Voltage Max
        charging_current_max:
          name: Yesterday Charging Current Max
        discharging_current_max:
          name: Yesterday Discharging Current Max
        charging_power_max:
          name: Yesterday Charging Power Max
        discharging_power_max:
          name: Yesterday Discharging Power Max
        charging_amp_hours:
          name: Yesterday Charging Amp Hours
        discharging_amp_hours:
          name: Yesterday Discharging Amp Hours
        power_generation:
          name: Yesterday Power Generation
        power_consumption:
          name: Yesterday Power Consumption
      - day: 7
        power_generation:
          name: Week Ago Power Generation

binary_sensor:
  - platform: srne_ml24xx
    srne_ml24xx_id: srne_ml24xx_controller
    load_status:
      name: Load Status
    load_open_circuit:
      name: Load Open Circuit
    induction_probe_damaged:
      name: Induction Probe Damaged
    capacitor_over_voltage:
